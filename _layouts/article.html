---
layout: default
---
<article class="article">
  <div class="article-header">
    <a class="article-back" href="{{ '/' | relative_url }}">&larr; All Articles</a>
    <h1 class="article-title">{{ page.title }}</h1>
    <span class="article-meta">{{ page.date | date: "%B %-d, %Y" }}</span>
  </div>
  <div class="article-body">
    {{ content }}
  </div>
</article>
